[project]
name = "agent-offload"
version = "0.1.0"
description = "Durable remote coding tasks and attached agent relays"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-offload = "agent_offload.entry:cli"
agent-offload-worker = "agent_offload.entry:worker"
agent-offload-task-worker = "agent_offload.entry:task_worker"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
